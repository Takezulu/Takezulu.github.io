/* ---------------- language switching ---------------- */
const docEl = document.getElementById('doc');
const buttons = [...document.querySelectorAll('.langs button')];

function apply(lang){
  const d = L[lang] || L.en;
  document.documentElement.lang = d.htmlLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if (d[k] != null) el.textContent = d[k];
  });
  docEl.innerHTML = d.doc;
  buttons.forEach(b=>b.setAttribute('aria-selected', String(b.dataset.lang === lang)));
  try{ localStorage.setItem('rpgig_lang', lang); }catch(e){}
}

function detect(){
  try{
    const saved = localStorage.getItem('rpgig_lang');
    if (saved && L[saved]) return saved;
  }catch(e){}
  const n = (navigator.languages && navigator.languages[0] || navigator.language || 'en').toLowerCase();
  if (n.startsWith('ko')) return 'ko';
  if (n.startsWith('th')) return 'th';
  if (n.startsWith('vi')) return 'vi';
  if (n.startsWith('zh')) return 'zh';
  return 'en';
}

buttons.forEach(b=>b.addEventListener('click', ()=>apply(b.dataset.lang)));
apply(detect());

/* ---------------- theme toggle ---------------- */
const themeBtn = document.getElementById('themeBtn');
try{
  const t = localStorage.getItem('rpgig_theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
}catch(e){}
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('rpgig_theme', next); }catch(e){}
});
</script>
