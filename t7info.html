<style>
:root{--bg:#14161c;--card:#1d2028;--card2:#232734;--line:#2f3442;--text:#e6e8ee;--muted:#8a8f99;--accent:#ffcf5c;--accent2:#7fb2ff;--shine:#c9a6ff;--good:#8cf06a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{padding:18px 14px 8px;border-bottom:1px solid var(--line);background:linear-gradient(#1a1d26,#14161c)}
h1{margin:0 0 4px;font-size:20px;color:var(--accent)}
.sub{color:var(--muted);font-size:12px;margin:0 0 10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button,.filters button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.tabs button.on,.filters button.on{background:var(--accent);color:#1a1400;border-color:var(--accent);font-weight:600}
.filters{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13px}
.filters .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{color:var(--muted);margin-right:2px}
.filters label{display:flex;align-items:center;gap:4px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:10px 10px 40px}
h2{font-size:15px;color:var(--accent2);margin:18px 4px 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
.card>.head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.card>.head:hover{background:var(--card2)}
.ico{width:40px;height:40px;border-radius:6px;background:#0f1116;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.ttl{flex:1;min-width:0}
.ttl .nm{font-weight:600;font-size:15px}
.shine .ttl .nm{color:var(--shine)}
.ttl .mt{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#2b3a2b;color:var(--good);margin-left:6px;vertical-align:middle;white-space:nowrap}
.badge.warn{background:#3a2f2b;color:#ffb454}
.chev{color:var(--muted);transition:transform .15s}
.card.open .chev{transform:rotate(90deg)}
.body{display:none;padding:4px 12px 14px;border-top:1px solid var(--line)}
.card.open .body{display:block}
h3{font-size:13px;color:var(--accent);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.3px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:3px 14px;font-size:13px}
.stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #2a2e3a;padding:2px 0}
.stats b{font-weight:600;color:#fff}
.road{background:#0f1116;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.65}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--muted);font-weight:500;white-space:nowrap;font-size:12px}
td.lv{white-space:nowrap;font-weight:600;color:var(--accent)}
td.num{text-align:right;white-space:nowrap}
.intro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 12px 12px;margin:12px 0 4px;font-size:13px}
.intro h2{margin-top:10px}
.intro p{margin:6px 0}
.intro li.var{margin-top:4px;color:var(--text)}
.muted{color:var(--muted)}
table.pt{width:100%}
table.pt th,table.pt td{padding:3px 4px;font-size:12px}
table.pt th.num,table.pt td.num{text-align:right;white-space:nowrap}
.sk .t{color:#fff;font-weight:600}
.sk .d{color:var(--muted)}
.bonus span{display:inline-block;margin-right:8px}
.attr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.attr .tab{background:#0f1116;border-radius:8px;padding:8px 10px}
.attr .tab .n{color:var(--accent2);font-weight:600;font-size:12px;margin-bottom:4px}
.attr .tab li{font-size:12.5px}
.attr ul{margin:0;padding-left:16px}
.diff{font-size:12.5px;color:var(--muted)}
.diff table{width:auto}
.tw{overflow-x:auto}
.opt{font-size:12px;color:var(--muted);margin:4px 0 6px;display:flex;gap:14px;flex-wrap:wrap}
footer{color:var(--muted);font-size:11px;text-align:center;padding:14px;border-top:1px solid var(--line);word-break:break-all}
.empty{color:var(--muted);text-align:center;padding:30px}
@media (max-width:480px){.attr{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}th,td{padding:5px 4px}}
</style>

<script>
(function(){
var D = JSON.parse(document.getElementById('data').textContent);
var S = {lang:'KR', cls:'all', grade:'all', showCost:true, open:{}};
try{ var l=localStorage.getItem('t7lang'); if(l && D.langs.indexOf(l)>=0) S.lang=l; }catch(e){}
function T(k){ var o=D.ui[k]||{}; return (S.lang in o) ? o[S.lang] : (o.KR||k); }
function L(o){ return o ? (o[S.lang] || o.EN || o.KR || '') : ''; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmtN(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function el(tag, attrs, html){ var e=document.createElement(tag); if(attrs) for(var k in attrs) e.setAttribute(k,attrs[k]); if(html!=null) e.innerHTML=html; return e; }

function classText(it){
  if(it.classes.length===4) return T('allclass');
  return it.classes.map(function(c){ for(var i=0;i<D.classes.length;i++) if(D.classes[i].key===c) return L(D.classes[i].name); return c; }).join(' / ');
}

function renderHeader(){
  document.getElementById('title').textContent = T('title');
  document.getElementById('subtitle').textContent = T('subtitle');
  document.title = T('title');
  var langs=document.getElementById('langs'); langs.innerHTML='';
  D.langs.forEach(function(l){
    var b=el('button',{type:'button'}, esc(D.langLabel[l]));
    if(l===S.lang) b.className='on';
    b.onclick=function(){ S.lang=l; try{localStorage.setItem('t7lang',l);}catch(e){} render(); };
    langs.appendChild(b);
  });
  var cf=document.getElementById('clsFilter'); cf.innerHTML='<span class="lbl">'+esc(T('class'))+'</span>';
  [{k:'all',n:T('all')}].concat(D.classes.map(function(c){return {k:c.key,n:L(c.name)};})).concat([{k:'common',n:T('common')}]).forEach(function(o){
    var b=el('button',{type:'button'},esc(o.n)); if(S.cls===o.k) b.className='on';
    b.onclick=function(){S.cls=o.k; render();}; cf.appendChild(b);
  });
  var gf=document.getElementById('gradeFilter'); gf.innerHTML='<span class="lbl">'+esc(T('grade'))+'</span>';
  [{k:'all',n:T('all')},{k:'plain',n:T('plain')},{k:'shine',n:T('shine')}].forEach(function(o){
    var b=el('button',{type:'button'},esc(o.n)); if(S.grade===o.k) b.className='on';
    b.onclick=function(){S.grade=o.k; render();}; gf.appendChild(b);
  });
  document.getElementById('showCostLbl').textContent=T('showcost');
}

function visible(it){
  if(S.grade!=='all' && it.grade!==S.grade) return false;
  if(S.cls==='all') return true;
  if(S.cls==='common') return it.classes.length===4;
  return it.classes.indexOf(S.cls)>=0;
}

function renderStats(stats){
  return '<div class="stats">'+stats.map(function(s){ return '<div><span>'+esc(L(s.label))+'</span><b>'+esc(s.value)+'</b></div>'; }).join('')+'</div>';
}

function renderLevels(it){
  var h='<div class="tw"><table><thead><tr><th>'+esc(T('lv'))+'</th><th>'+esc(T('roadmap'))+'</th><th>'+esc(T('points'))+'</th>';
  if(S.showCost) h+='<th>'+esc(T('cost'))+'</th>';
  h+='</tr></thead><tbody>';
  it.levels.forEach(function(lv){
    h+='<tr><td class="lv">+'+lv.lv+'</td><td>';
    var sk = lv.skill ? D.skills[lv.skill] : null;
    if(sk){ h+='<div class="sk"><div class="t">'+L(sk.title)+'</div><div class="d">'+L(sk.des)+'</div></div>'; }
    var gains = lv.bonus.map(function(b){return '<span>'+esc(L(b.label))+L(D.plusFmt).replace('{0}', esc(b.value))+'</span>';});
    if(lv.gain>0) gains.push('<span>'+esc(T('points'))+L(D.plusFmt).replace('{0}', lv.gain)+'</span>');
    if(gains.length) h+='<div class="bonus">'+gains.join('')+'</div>';
    if(!sk && !gains.length) h+='<span style="color:var(--muted)">-</span>';
    h+='</td><td class="num">'+(lv.points||0)+'</td>';
    if(S.showCost) h+='<td class="num">'+(lv.cost? esc(L(D.matNames[lv.cost.item]))+' × '+fmtN(lv.cost.count) : '-')+'</td>';
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

function renderAttr(it){
  var maxLbl = T('ptmax').replace('{0}', it.maxEnchant);
  return '<div class="attr">'+it.attrTabs.map(function(t){
    return '<div class="tab"><div class="n">'+esc(L(t.name))+'</div><table class="pt"><thead><tr><th></th><th>'+esc(T('pt1'))+'</th><th>'+esc(maxLbl)+'</th></tr></thead><tbody>'+
      t.stats.map(function(s){return '<tr><td>'+esc(L(s.name))+'</td><td class="num">'+L(D.plusFmt).replace('{0}',esc(s.v1))+'</td><td class="num">'+L(D.plusFmt).replace('{0}',esc(s.vmax))+'</td></tr>';}).join('')+
      '</tbody></table></div>';
  }).join('')+'</div>';
}

function renderIntro(){
  var h='<section class="intro"><h2>'+esc(T('introhead'))+'</h2><p>'+esc(T('intro1'))+'</p><p>'+esc(T('intro2'))+'</p><div class="attr">';
  D.introTabs.forEach(function(t){
    h+='<div class="tab"><div class="n">'+esc(L(t.name))+'</div><ul>'+t.common.map(function(n){return '<li>'+esc(L(n))+'</li>';}).join('');
    if(t.variants.length){
      h+='<li class="var">'+esc(T('partvar'))+': '+t.variants.map(function(v){return esc(L(v.stat))+' <span class="muted">('+v.parts.map(function(p){return esc(L(p));}).join(' · ')+')</span>';}).join(' / ')+'</li>';
    }
    h+='</ul></div>';
  });
  h+='</div><p class="muted">'+esc(T('intro3'))+'</p></section>';
  return el('div',null,h);
}

function renderShine(it){
  if(!it.shine) return '';
  var h='';
  if(it.grade==='plain' && it.shine.statDiff.length){
    h+='<h3>'+esc(T('shinediff'))+'</h3><div class="diff tw"><table><thead><tr><th></th><th>'+esc(T('plain'))+'</th><th>'+esc(T('shine'))+'</th></tr></thead><tbody>';
    it.shine.statDiff.forEach(function(d){ h+='<tr><td>'+esc(L(d.label))+'</td><td class="num">'+esc(d.plain)+'</td><td class="num">'+esc(d.shine)+'</td></tr>'; });
    h+='</tbody></table></div>';
  }
  return h;
}

function renderCard(it){
  var card=el('div',{'class':'card '+it.grade+(S.open[it.id]?' open':'')});
  var badge='';
  if(it.shine && it.grade==='plain') badge = it.shine.sameLevels ? '<span class="badge">'+esc(T('shinesame'))+'</span>' : '<span class="badge warn">'+esc(T('shineskilldiff'))+'</span>';
  var head=el('div',{'class':'head'},
    '<div class="ico">'+(it.icon?'<img src="'+it.icon+'" alt="">':esc(L(it.part)))+'</div>'+
    '<div class="ttl"><div class="nm">'+esc(L(it.name))+badge+'</div>'+
    '<div class="mt">'+esc(L(D.catFmt).replace('{0}', L(it.part)))+' · '+esc(classText(it))+' · '+esc(L(D.weightLbl))+' : '+it.weight+' · '+esc(T('maxench'))+' Max +'+it.maxEnchant+'</div></div>'+
    '<div class="chev">▶</div>');
  head.onclick=function(){ S.open[it.id]=!S.open[it.id]; card.classList.toggle('open'); };
  card.appendChild(head);
  var body=el('div',{'class':'body'});
  body.innerHTML =
    '<h3>'+esc(T('basic'))+'</h3>'+renderStats(it.stats)+
    renderShine(it)+
    '<h3>'+esc(T('roadmap'))+'</h3><div class="road">'+L(it.roadmap)+'</div>'+
    '<h3>'+esc(T('perlevel'))+' '+esc(L(D.rangeFmt).replace('{0}','+0').replace('{1}','+'+it.maxEnchant))+'</h3>'+renderLevels(it)+
    '<h3>'+esc(T('attr'))+'</h3>'+renderAttr(it);
  card.appendChild(body);
  return card;
}

function render(){
  renderHeader();
  var main=document.getElementById('main'); main.innerHTML='';
  main.appendChild(renderIntro());
  var any=false;
  D.groups.forEach(function(g){
    var list=D.items.filter(function(it){ return it.group===g.key && visible(it); });
    if(!list.length) return;
    any=true;
    main.appendChild(el('h2',null,esc(L(g.name))+' <span style="color:var(--muted);font-weight:400">'+list.length+esc(T('count'))+'</span>'));
    list.forEach(function(it){ main.appendChild(renderCard(it)); });
  });
  if(!any) main.appendChild(el('div',{'class':'empty'},esc(T('noitems'))));
  document.getElementById('footer').textContent = T('datadate')+': '+D.footer.date+' · source='+D.footer.source+' · '+D.footer.files.join(' ');
}
document.getElementById('showCost').onchange=function(){ S.showCost=this.checked; render(); };
render();
})();
</script>
</body>
</html>
